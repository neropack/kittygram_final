version: '3.8'

services:
  db:
    image: postgres:13
    env_file:
      - .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  backend:
    image: neropack/kittygram_backend:latest  # DockerHub username
    restart: always
    volumes:
      - static:/var/www/static
      - media:/var/www/media
    env_file:
      - .env
    depends_on:
      - db

  frontend:
    image: neropack/kittygram_frontend:latest
    restart: always
    volumes:
      - static:/var/www/static/frontend

  gateway:
    image: neropack/kittygram_gateway:latest
    restart: always
    ports:
      - "9000:80"
    volumes:
      - static:/var/www/static
      - media:/var/www/media
    depends_on:
      - backend
      - frontend

volumes:
  pg_data:
  static:
  media: