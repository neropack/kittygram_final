name: Kittygram Workflow

on:
  push:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13.10
        env:
          POSTGRES_USER: kittygram_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: kittygram
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8==7.3.0 flake8-isort==7.0.0
        pip install -r ./backend/requirements.txt 
    - name: Test with flake8 and django tests
      run: python -m flake8 backend/
    - name: Django tests
      env:
        POSTGRES_USER: kittygram_user
        POSTGRES_PASSWORD: test_password
        POSTGRES_DB: kittygram
        DB_HOST: 127.0.0.1
        DB_PORT: 5432
        SECRET_KEY: testsecret123
      run: |
        python -m flake8 backend/
        cd backend/
        python manage.py test

  frontend_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up nodeJS
      uses: actions/setup-node@v3
      with:
        node-version: 18
    - name: Install dependencies
      run: |
        cd frontend/
        npm ci
    - name: Test frontend
      run: |
        cd frontend/
        npm run test

  build_backend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: neropack/kittygram_backend:latest

  build_frontend:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend/
          push: true
          tags: neropack/kittygram_frontend:latest

  build_gateway:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to DockerHub 
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: build and push gateway
        uses: docker/build-push-action@v4
        with:
          context: ./nginx/
          push: true
          tags: neropack/kittygram_gateway:latest

  deploy:
    runs-on: ubuntu-latest
    needs: 
      - build_backend
      - build_frontend
      - build_gateway
    steps:
      - uses: actions/checkout@v3
      - name: Copy files via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.production.yml,.env.example"
          target: "kittygram/"
          strip_components: 0
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p ~/kittygram
            cd ~/kittygram
            
            # Создаем .env из .env.example если его нет
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "✅ .env created from .env.example"
            else
              echo "ℹ️ .env already exists"
            fi
            
            echo "📋 Environment variables:"
            grep -E '^(DB_|SECRET_KEY|DEBUG)' .env || true
            
            echo "🐳 Docker Compose version:"
            sudo docker compose version
            
            echo "⬇️ Pulling latest images..."
            sudo docker compose -f docker-compose.production.yml pull
            
            echo "🛑 Stopping old containers..."
            sudo docker compose -f docker-compose.production.yml down || true
            
            echo "🚀 Starting containers..."
            sudo docker compose -f docker-compose.production.yml up -d
            
            echo "⏳ Waiting 30s for startup..."
            sleep 30
            
            echo "🔄 Running database migrations..."
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py migrate
            
            echo "📦 Collecting static files..."
            sudo docker compose -f docker-compose.production.yml exec -T backend python manage.py collectstatic --noinput
            
            echo "📁 Copying static files to volume..."
            sudo docker compose -f docker-compose.production.yml exec -T backend cp -r collected_static/. /backend_static/ || true
            
            echo "📊 Container status:"
            sudo docker compose -f docker-compose.production.yml ps
            
            echo "📋 Backend logs (last 10):"
            sudo docker compose -f docker-compose.production.yml logs --tail=10 backend || true
            
            echo "🎉 ✅ Kittygram deployed successfully!"